version: '3.9'

services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER_FILE: /run/secrets/db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: "@Qwerty7"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_username
      - db_password

  app:
    build: .
    container_name: ecommerce-app
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      AESGCM_MASTERKEY_FILE: /run/secrets/masterkey
      SPRING_DATASOURCE_USERNAME_FILE: /run/secrets/db_username
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/postgres

#      AESGCM_MASTERKEY_BASE64: 4OJczRwt3b++cRMWzfq8aIXzkyG9j4YmbKgq6E5fGUs=
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    secrets:
      - masterkey

secrets:
  masterkey:
    file: ./masterkey.txt
  db_username:
    file: ./db_username.txt
  db_password:
    file: ./db_password.txt

volumes:
  postgres_data:
